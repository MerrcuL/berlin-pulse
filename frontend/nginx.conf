server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing – return index.html for all non-file paths
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must not be cached by browsers so updates are instant
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Proxy API requests to the gateway service
    location /api/ {
        resolver 168.63.129.16 100.100.0.10 valid=30s ipv6=off;
        set $backend_upstream "http://gateway-service.internal.calmdesert-277cde2b.switzerlandnorth.azurecontainerapps.io:80";
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Long-term cache for Vite build assets (hashed filenames – safe to cache forever)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Gzip configuration
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;
}
