# Weather Serverless Function Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather
  labels:
    app: berlin-pulse
    component: weather
spec:
  replicas: 1
  selector:
    matchLabels:
      component: weather
  template:
    metadata:
      labels:
        app: berlin-pulse
        component: weather
    spec:
      containers:
        - name: weather
          image: berlinpulse/weather:latest
          ports:
            - containerPort: 4005
          env:
            - name: PORT
              value: "4005"
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "64Mi"
              cpu: "100m"
          livenessProbe:
            httpGet:
              path: /health
              port: 4005
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 4005
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: weather
spec:
  selector:
    component: weather
  ports:
    - port: 4005
      targetPort: 4005
  type: ClusterIP
