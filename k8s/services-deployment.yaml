# Events Service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: events
  labels:
    app: berlin-pulse
    component: events
spec:
  replicas: 1
  selector:
    matchLabels:
      component: events
  template:
    metadata:
      labels:
        app: berlin-pulse
        component: events
    spec:
      containers:
        - name: events
          image: berlinpulse/events:latest
          ports:
            - containerPort: 4001
          env:
            - name: PORT
              value: "4001"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /health
              port: 4001
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 4001
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: events
spec:
  selector:
    component: events
  ports:
    - port: 4001
      targetPort: 4001
  type: ClusterIP
---
