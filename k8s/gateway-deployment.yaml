# API Gateway Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app: berlin-pulse
    component: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      component: gateway
  template:
    metadata:
      labels:
        app: berlin-pulse
        component: gateway
    spec:
      containers:
        - name: gateway
          image: berlinpulse/gateway:latest
          ports:
            - containerPort: 4000
          env:
            - name: PORT
              value: "4000"
            - name: EVENTS_SERVICE_URL
              value: "http://events:4001"
            - name: TRANSPORT_SERVICE_URL
              value: "http://transport:4002"
            - name: NEWS_SERVICE_URL
              value: "http://news:4003"
            - name: WEATHER_SERVICE_URL
              value: "http://weather:4005"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  selector:
    component: gateway
  ports:
    - port: 4000
      targetPort: 4000
  type: ClusterIP
